<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tree Rings</title>
  <style>
    /* Page Layout Setup */
    .page-wrapper {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: 'Trebuchet MS', Arial, sans-serif;
      width: 100vw;
      height: 100vh;
      margin: 0;
      background-color: #ffffff;
    }

    /* STATIC HEADER ABOVE THE RINGS */
    .ring-title {
      font-size: 1.8rem;
      font-weight: 600;
      color: #222222;
      margin-bottom: 20px;
      text-transform: uppercase;
    }

    .container {
      position: relative;       
      display: flex;
      justify-content: center;   
      align-items: center;       
      width: 350px;             
      height: 350px;            
    }

    /* CRITICAL CLICK/HOVER OVERLAP FIX */
    .container a {
      position: absolute;
      pointer-events: none; 
    }

    /* Deactivate mouse intercepts on the white fill vectors */
    .container svg path[fill="white"],
    .container svg use {
      pointer-events: none;
    }

    /* Activate hover detection ONLY on the black outline paths */
    .container svg path[stroke="black"] {
      pointer-events: stroke;
      cursor: pointer;
      transition: stroke-width 0.2s ease-in-out;
      stroke-dasharray: 100;
      stroke-dashoffset: 100;
      animation: drawRing 1.2s ease-in-out forwards;
      animation-delay: var(--delay);
    }

    /* Hover interactions for the stroke path lines */
    .container a:hover path[stroke="black"] {
      stroke-width: 5px; 
    }

    @keyframes drawRing {
      to { stroke-dashoffset: 0; }
    }

    /* HOVER CAPTION ELEMENT */
    .ring-caption {
      margin-top: 30px;
      font-size: 1.2rem;
      font-weight: 500;
      color: #333333;
      min-height: 1.5em; 
    }

    /* DEFAULT TEXT STATE */
    .container:not(:has(a:hover)) ~ .ring-caption::after {
      content: "click on a tree ring to explore";
    }

    /* DYNAMIC TEXT MAPPING SYSTEM */
    .container:has(.r1:hover) ~ .ring-caption::after { content: "PORTUGAL - SUMMER 2023"; }
    .container:has(.r2:hover) ~ .ring-caption::after { content: "TAIWAN BIKE TRIP - WINTER 2024"; }
    .container:has(.r3:hover) ~ .ring-caption::after { content: "TAIWAN TEACHING + HAWAII - SUMMER 2025"; }
    .container:has(.r4:hover) ~ .ring-caption::after { content: "FLORDIA + BAHAMAS - WINTER 2025"; }
    .container:has(.r5:hover) ~ .ring-caption::after { content: "ICELAND - SUMMER 2026"; }
  </style>
</head>
<body>

  <div class="page-wrapper">

    <h2 class="ring-title">Tree Rings</h2>

    <div class="container">
      <!-- Ring 5 (Outermost) -->

          <path pathLength="100" d="M341.5 159.588C341.5 247.726 265.053 310.5 170.75 310.5C76.4474 310.5 0 247.726 0 159.588C0 71.4501 76.4474 0 170.75 0C265.053 0 341.5 71.4501 341.5 159.588Z" stroke-width="3" stroke="black" fill="none"/>
