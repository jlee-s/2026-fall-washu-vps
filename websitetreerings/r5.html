<!DOCTYPE html>

<style>
html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;           /* the page never scrolls; you drag the gallery instead */
    background-color: #ffffff;
    color: #222222;
    text-transform: lowercase;
    font-family: 'Trebuchet MS', Arial, sans-serif;
}

svg {
    overflow: visible;
}

/* ---------- The window you look through ---------- */
.view {
    position: fixed;
    inset: 0;
    overflow: hidden;
    cursor: grab;
    touch-action: none;          /* we handle touch dragging ourselves */
    user-select: none;
    -webkit-user-select: none;
}
.view.dragging { cursor: grabbing; }

/* ---------- The big surface that moves. 1 unit = 1% of the shorter screen side (min 6px) ---------- */
.world {
    --u: max(1vmin, 6px);
    position: absolute;
    left: 0;
    top: 0;
    width: calc(316 * var(--u));
    height: calc(216 * var(--u));
    will-change: transform;
}

/* ---------- Title in the middle of the surface ---------- */
.image-mask {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    z-index: 2;
}
.image-mask a { display: block; }

.svg-title {
    font-family: 'Trebuchet MS', Arial, sans-serif;
    font-size: 28px;
    font-weight: bold;
    fill: black;
    text-transform: uppercase;
    letter-spacing: 2px;
}

/* Hint under the title: invisible at first, fades in after 10 seconds */
.svg-hint {
    font-family: 'Trebuchet MS', Arial, sans-serif;
    font-size: 14px;
    fill: #555555;
    letter-spacing: 1px;
    opacity: 0;
    pointer-events: none;
    animation: hint-in 1.4s ease 10s forwards;
}
@keyframes hint-in { to { opacity: 1; } }

/* ---------- Photos ("bulbs") ---------- */
.bulb {
    position: absolute;
    left: calc(var(--x) * var(--u));
    top: calc(var(--y) * var(--u));
    width: calc(var(--w) * var(--u));
    height: calc(var(--h) * var(--u));
    margin: 0;
    transform: rotate(var(--tilt));
}

/* two growth-ring outlines behind each photo, each a different wobbly shape */
.bulb::before,
.bulb::after {
    content: "";
    position: absolute;
    pointer-events: none;
    z-index: 0;
    border-style: solid;
    border-color: #000000;
}
.bulb::before {
    inset: calc(var(--u) * -1.3);
    border-width: 2px;
    border-radius: 45% 55% 40% 60% / 55% 45% 60% 40%;
    transform: rotate(calc(var(--tilt) * -1.6));
}
.bulb::after {
    inset: calc(var(--u) * -2.6);
    border-width: 1.2px;
    border-radius: 58% 42% 52% 48% / 42% 58% 46% 54%;
    transform: rotate(calc(var(--tilt) * 1.9));
}

/* Organic container for both images and map iframes */
.media-container {
    position: relative;
    z-index: 1; /* sits above the echo rings so they appear to grow out from behind */
    width: 100%;
    height: 100%;
    display: block;
    overflow: hidden;
    background-color: #fcfcfc;
    border: 3px solid #000000;
    box-sizing: border-box;
}

/* Unequal corners to emulate tree ring contours: six shapes so neighbours differ */
.b1 .media-container { border-radius: 60% 40% 55% 45% / 45% 55% 40% 60%; }
.b2 .media-container { border-radius: 42% 58% 46% 54% / 56% 44% 58% 42%; }
.b3 .media-container { border-radius: 52% 48% 38% 62% / 48% 52% 62% 38%; }
.b4 .media-container { border-radius: 38% 62% 58% 42% / 60% 40% 45% 55%; }
.b5 .media-container { border-radius: 55% 45% 62% 38% / 40% 60% 50% 50%; }
.b6 .media-container { border-radius: 46% 54% 44% 56% / 62% 38% 54% 46%; }

.media-container img,
.media-container iframe {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    border: 0;
    pointer-events: none;        /* so dragging over a photo still drags the gallery */
}
</style>
</head>
<body>

<script>
/* Press and hold (mouse or finger) to drag around the gallery. It moves only while you hold down
   and stops the moment you let go. Arrow keys also work for keyboard users. */
(function () {
  var view = document.getElementById('view');
  var world = document.getElementById('world');
  var x = 0, y = 0, vx = 0, vy = 0;
  var dragging = false, moved = 0, lastX = 0, lastY = 0, raf = null;

  function clamp() {
    var vw = view.clientWidth, vh = view.clientHeight;
    var ww = world.offsetWidth, wh = world.offsetHeight;
    x = ww <= vw ? (vw - ww) / 2 : Math.min(0, Math.max(vw - ww, x));
    y = wh <= vh ? (vh - wh) / 2 : Math.min(0, Math.max(vh - wh, y));
  }
  function apply() {
    clamp();
    world.style.transform = 'translate3d(' + x + 'px,' + y + 'px,0)';
  }
  function center() {
    x = (view.clientWidth - world.offsetWidth) / 2;
    y = (view.clientHeight - world.offsetHeight) / 2;
    apply();
  }

  /* The gallery only starts moving once the pointer has travelled a few pixels while held down.
     Until then it is just a click, so clicking "2026" still follows its link. */
  var down = false, startX = 0, startY = 0;

  view.addEventListener('pointerdown', function (e) {
    if (e.button !== undefined && e.button !== 0) return;
    down = true; dragging = false; moved = 0;
    startX = lastX = e.clientX; startY = lastY = e.clientY;
  });
  view.addEventListener('pointermove', function (e) {
    if (!down) return;
    if (!dragging) {
      moved = Math.max(moved, Math.abs(e.clientX - startX) + Math.abs(e.clientY - startY));
      if (moved < 5) return;
      dragging = true;
      view.classList.add('dragging');
      view.setPointerCapture(e.pointerId);
    }
    var dx = e.clientX - lastX, dy = e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    moved += Math.abs(dx) + Math.abs(dy);
    x += dx; y += dy;
    apply();
  });
  function end(e) {
    down = false;
    if (!dragging) return;
    dragging = false;
    view.classList.remove('dragging');
    if (view.hasPointerCapture(e.pointerId)) view.releasePointerCapture(e.pointerId);
  }
  view.addEventListener('pointerup', end);
  view.addEventListener('pointercancel', end);

  /* a drag should not count as a click on the title link */
  view.addEventListener('click', function (e) {
    if (moved > 6) { e.preventDefault(); e.stopPropagation(); }
  }, true);

  view.addEventListener('keydown', function (e) {
    var s = 90, k = e.key;
    if (k === 'ArrowLeft') x += s; else if (k === 'ArrowRight') x -= s;
    else if (k === 'ArrowUp') y += s; else if (k === 'ArrowDown') y -= s;
    else return;
    e.preventDefault(); apply();
  });

  window.addEventListener('resize', apply);
  center();
  view.focus({ preventScroll: true });
})();
</script>
